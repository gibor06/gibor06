# .github/workflows/profile-3d.yml
# Generates a 3D contribution graph and commits it to the repo.
# After first push, run manually: Actions → GitHub-Profile-3D-Contrib → Run workflow

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # Runs daily at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: gibor06
          MAX_REPOS: 10
          SETTING_JSON: |
            {
              "githubUserName": "gibor06",
              "type": "NORMAL",
              "title": "GIBOR // AI LAB — Contribution Universe"
            }

      - name: Commit and push generated SVGs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update 3D contribution graph [skip ci]"
          git push
