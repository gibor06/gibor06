# .github/workflows/metrics.yml
# Generates GitHub Metrics dashboard and commits the SVG.
# Requires secret: METRICS_TOKEN (PAT with public_repo scope)
# After first push, run manually: Actions → GitHub Metrics → Run workflow

name: GitHub Metrics

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "metrics.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    name: Generate Metrics Dashboard

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # Core settings
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: gibor06
          filename: metrics.svg
          base: header, activity, community, repositories

          # Plugin: Languages breakdown
          plugin_languages: yes
          plugin_languages_ignored: html, css, dockerfile
          plugin_languages_limit: 8
          plugin_languages_colors: github

          # Plugin: Isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Plugin: Habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Error resilience (avoid workflow failure if a plugin has minor API warnings)
          plugins_errors_fatal: no

          # Visual settings
          config_theme: dark
          config_output: svg
          config_padding: 6%
