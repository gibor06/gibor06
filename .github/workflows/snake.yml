# .github/workflows/snake.yml
# Generates GitHub contribution snake animation and commits to output branch.
# After first push, run manually: Actions → Generate Snake → Run workflow

name: Generate Snake

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate Snake Animation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation (dark theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gibor06
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=22D3EE&color_dots[0]=0D1117&color_dots[1]=0e3a5c&color_dots[2]=1d5fa8&color_dots[3]=2d82e0&color_dots[4]=38BDF8
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=3B82F6

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
